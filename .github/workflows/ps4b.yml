name: PS4b Browser Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ps4b:
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ORBIS SDK
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git tp/openorbis
          echo "$GITHUB_WORKSPACE/tp/openorbis/bin/linux" >> $GITHUB_PATH
          echo "OO_TOOLCHAIN=$GITHUB_WORKSPACE/tp/openorbis" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake python3

      - name: Configure build
        run: |
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=$OO_TOOLCHAIN/orbis-llvm.cmake

      - name: Build PS4b
        run: |
          # Check available libraries
          echo "=== Checking OpenOrbis libraries ==="
          ls -la tp/openorbis/lib/ | head -50
          echo "=== Checking for kernel lib ==="
          find tp/openorbis -name "*kernel*" -o -name "*SceNet*" -o -name "*SceHttp*" | head -20
          echo "=== Building ==="
          cmake --build build --target PS4b -j 3

      - name: Package PS4b
        run: |
          mkdir -p pkg

          # Copy the built binary as artifact
          if [ -f build/PS4b.self ]; then
            cp build/PS4b.self pkg/PS4b.self
            echo "Found PS4b.self"
          elif [ -f build/PS4b ]; then
            cp build/PS4b pkg/PS4b
            echo "Found PS4b"
          else
            echo "No binary found in build/"
            ls -la build/
          fi

          # Check for OpenOrbis packaging tools
          if [ -d "$OO_TOOLCHAIN/tools" ]; then
            echo "OpenOrbis tools directory found"
            ls -la "$OO_TOOLCHAIN/tools"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4b-pkg
          path: pkg/*
