name: PS4b Browser Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ps4b:
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ORBIS SDK
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git tp/openorbis
          echo "$GITHUB_WORKSPACE/tp/openorbis/bin/linux" >> $GITHUB_PATH
          echo "OO_TOOLCHAIN=$GITHUB_WORKSPACE/tp/openorbis" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake

      - name: Configure build
        run: |
          cmake -B build -S .

      - name: Build PS4b
        run: |
          cmake --build build --target PS4b -j 3

      - name: Package PS4b
        run: |
          mkdir -p pkg
          if command -v ps4-packager >/dev/null 2>&1; then
            ps4-packager build/PS4b.self pkg/PS4b.pkg
          elif [ -f build/PS4b ]; then
            cp build/PS4b pkg/PS4b.pkg
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4b-pkg
          path: pkg/*
