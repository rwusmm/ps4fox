<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrbisFox — Debug Monitor</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; min-height: 100%; }
  html { overflow: auto; }
  body { padding: 20px; background: #101828; color: #f1f5ff; font: 14px/1.5 "Noto Sans", sans-serif; }
  .debug-panel { max-width: 900px; margin: 0 auto; }
  .debug-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
  .debug-header h1 { margin: 0; font-size: 24px; color: #ff963c; }
  .debug-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: #171f30; border: 2px solid #42526d; border-radius: 8px; padding: 16px; }
  .stat-label { color: #64728b; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .stat-value { font-size: 24px; font-weight: bold; }
  .stat-value.fps { color: #facc15; }
  .stat-value.mem { color: #3b82f6; }
  .stat-value.err { color: #ff7875; }
  .error-log { background: #171f30; border: 2px solid #42526d; border-radius: 8px; padding: 16px; max-height: 300px; overflow: auto; }
  .error-entry { color: #cbd5e1; font-family: monospace; font-size: 12px; margin-bottom: 8px; padding: 4px 0; border-bottom: 1px solid #384052; }
  .error-entry.last { border-bottom: none; margin-bottom: 0; }
  .error-severity { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; }
  .severity.info { background: #64728b; }
  .severity.warning { background: #facc15; }
  .severity.error { background: #ff7875; }
  .toggle-btn { padding: 6px 12px; border: 1px solid #64728b; border-radius: 4px; background: #222939; color: #e9edf5; font: inherit; cursor: pointer; margin: 4px; }
  .toggle-btn.active { background: #ff963c; color: #111; border-color: #ff963c; }
</style>
</head>
<body>
  <div class="debug-panel">
    <div class="debug-header">
      <h1>OrbisFox Debug Monitor</h1>
      <button class="toggle-btn" id="infoToggle">Info</button>
    </div>

    <div class="debug-stats">
      <div class="stat-card">
        <div class="stat-label">FPS</div>
        <div class="stat-value fps" id="statFps">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Memory</div>
        <div class="stat-value mem" id="statMem">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Errors</div>
        <div class="stat-value err" id="statErrors">0</div>
      </div>
    </div>

    <div class="error-log">
      <div style="color: #64728b; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">Error Log</div>
      <div id="errorLog" class="error-entry">No errors logged</div>
    </div>
  </div>

  <script>
    // Debug monitor initialization
    window.orbisfoxDebug = { errors: [], fps: 0, mem: 0, timer: null };

    // Simulate FPS tracking
    function updateFps() {
      const fpsEl = document.getElementById('statFps');
      // Simple FPS calculation
      window.orbisfoxDebug.fps = Math.round(1000 / (performance.now() - (window.orbisfoxDebug.last || performance.now())));
      window.orbisfoxDebug.last = performance.now();
      fpsEl.textContent = isFinite(window.orbisfoxDebug.fps) ? window.orbisfoxDebug.fps : '—';
    }
    setInterval(updateFps, 200);

    // Simulate memory tracking
    function updateMem() {
      const memEl = document.getElementById('statMem');
      // Simulated memory usage in MB
      window.orbisfoxDebug.mem = Math.round((performance.memory || { jsHeapTotal: 0 }).jsHeapTotal / 1024 / 1024);
      memEl.textContent = isFinite(window.orbisfoxDebug.mem) ? window.orbisfoxDebug.mem + ' MB' : '—';
    }
    setInterval(updateMem, 1000);

    // Error logging
    function logError(msg, severity = 'info') {
      const logEl = document.getElementById('errorLog');
      const entry = document.createElement('div');
      entry.className = 'error-entry ' + (logEl.children.length > 1 ? '' : 'last');
      const sevSpan = document.createElement('span');
      sevSpan.className = 'error-severity severity-' + severity;
      entry.innerHTML = sevOuterHTML + msg;
      // Actually build properly:
      entry.innerHTML = '<span class="error-severity severity-' + severity + '"></span>' + msg;
      logEl.insertBefore(entry, logEl.firstChild);
      // Keep only last 20 entries
      while (logEl.children.length > 20) logEl.removeChild(logEl.lastChild);
      window.orbisfoxDebug.errors.push({ msg, severity, timestamp: Date.now() });
      document.getElementById('statErrors').textContent = window.orbisfoxDebug.errors.length;
    }

    // Log some initial errors
    logError('Debug monitor initialized', 'info');
    logError('Sample CSS filter test completed', 'info');
    logError('Form control styling validated', 'info');

    // Update stats periodically
    setInterval(() => {
      updateFps();
      updateMem();
    }, 500);
  </script>
</body>
</html>
