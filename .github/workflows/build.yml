name: PS4 Browser Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ORBIS SDK
        uses: uxcn/action-orbis-sdk@v1
        with:
          orbis-sdk-version: latest

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake build-essential python3-pip

      - name: Build PS4 Browser
        run: |
          cd ps4
          chmod +x build_ps4.sh
          ./build_ps4.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps4-browser-build
          path: ps4/*
          retention-days: 30

      - name: Notify Discord
        if: always()
        uses: JasonETaylor/discord-webhook-action@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message: "PS4 Browser build ${{ job.status }} on ${{ runner.os }}"