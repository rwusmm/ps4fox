name: PS4Fox Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # The README and HOMEBREW_SDK.md specify a Linux host toolchain
    # (clang/lld, GNU make, Bash build scripts, Bubblewrap/GDB for the
    # portable-baseline host gate). windows-latest cannot run these scripts.
    runs-on: ubuntu-24.04
    timeout-minutes: 720

    env:
      ORBISFOX_SDK: homebrew
      # Keep native-build memory usage bounded; the README recommends
      # starting at 4 jobs rather than assuming all host cores fit.
      ORBISFOX_JOBS: "4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 keeps tags/commit identity available for the
          # release tag and the build reports that bind a source commit.
          fetch-depth: 0

      - name: Free disk space (engine build needs >= 100 GB)
        run: |
          df -h /
          # GitHub-hosted runners ship large preinstalled toolchains.
          # Remove the ones this project does not use.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            lld \
            llvm \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            python3-venv \
            nodejs \
            npm \
            curl \
            unzip \
            tar \
            xz-utils \
            git \
            bash \
            make \
            pkg-config \
            libssl-dev \
            libffi-dev \
            zlib1g-dev \
            libxml2-dev \
            libasound2-dev \
            libpulse-dev \
            bubblewrap \
            gdb \
            ffmpeg

      - name: Show toolchain versions
        run: |
          clang --version
          clang++ --version
          ld.lld --version
          python3 --version
          node --version
          make --version
          ffmpeg -version | head -n 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil

      - name: Install pinned Rust toolchain
        # build-gecko-app.py pins Rust source version 1.99.0; rustup must
        # install that exact toolchain rather than relying on a runner default.
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain 1.99.0 --profile minimal
          fi
          . "$HOME/.cargo/env"
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: Configure Gecko layout
        run: |
          python3 scripts/configure-gecko-layout.py --sdk homebrew

      - name: Export required Gecko headers
        # HOMEBREW_SDK.md: after fresh configuration, `mozilla-config.h`
        # and NSPR header links are NOT generated by configure alone.
        run: |
          ORBISFOX_SDK=homebrew make -C build/gecko-layout \
            mozilla-config.h install-dist/include

      - name: Run host regression tests
        # Do NOT swallow failures with `|| echo ...`. A release build must
        # fail closed when host tests fail.
        run: |
          ORBISFOX_SDK=homebrew make test

      - name: Build full Gecko engine
        # The README build command is:
        #   python3 scripts/build-gecko-app.py --sdk homebrew \
        #       --portable-baseline --jobs 4
        # build-gecko-app.py itself drives the engine pipeline; do not call
        # the app producer a second time with --skip-engine-build.
        run: |
          python3 scripts/build-gecko-app.py \
            --sdk homebrew \
            --portable-baseline \
            --jobs 4

      - name: Package Gecko app
        run: |
          ORBISFOX_SDK=homebrew python3 scripts/package-gecko.py \
            --sdk homebrew \
            --resource-format omni

      - name: Verify Gecko package
        run: |
          python3 scripts/verify-gecko-package.py --sdk homebrew

      - name: Confirm expected artifacts exist
        # The packager emits OrbisFox-Homebrew.pkg; do not rename it.
        # verify-gecko-package.py and downstream release notes reference
        # this exact name and the build reports bind its contents.
        run: |
          set -euo pipefail
          test -f dist/gecko-homebrew/OrbisFox-Homebrew.pkg
          test -f dist/gecko-homebrew/orbisfox.elf
          test -f build/gecko-app-homebrew/build-report.json
          test -f dist/gecko-homebrew/build-report.json
          ls -lh dist/gecko-homebrew/

      - name: Compute artifact hashes
        run: |
          cd dist/gecko-homebrew
          sha256sum OrbisFox-Homebrew.pkg orbisfox.elf build-report.json \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        # Always keep artifacts, even on failure, so crash/build evidence
        # can be inspected. See HARDWARE.md evidence levels.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbisfox-build-${{ github.sha }}
          path: |
            dist/gecko-homebrew/
            build/gecko-app-homebrew/build-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Create or update prerelease
        # RELEASE_NOTES.md and RELEASING.md require this stay a prerelease.
        # A successful CI link/package is NOT console acceptance: do not
        # imply hardware validation. Do not attach a source/relink kit
        # that has not passed the RELINKING.md gates.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ps4fox-${{ github.sha }}
          name: PS4Fox experimental build ${{ github.sha }}
          prerelease: true
          draft: true
          files: |
            dist/gecko-homebrew/OrbisFox-Homebrew.pkg
            dist/gecko-homebrew/orbisfox.elf
            dist/gecko-homebrew/build-report.json
            dist/gecko-homebrew/SHA256SUMS
          body: |
            ## PS4Fox experimental build (source-only CI)

            **Experimental. Not production-ready.**

            Automated build from `${{ github.sha }}` on `${{ github.ref_name }}`.
            Native SDK lane: `ps4-homebrew-dev/sdk` v0.2.1
            (`ecc8347aa20d7b3423405a5e94d7ab119485160d`).

            ### Package identity

            - Title: **OrbisFox SDK Test**
            - Title ID: **ORHB00001**
            - Profile: `/data/orbisfox/homebrew-profile` (separate from
              the legacy ORBF00001 browser; no automatic migration)
            - Resource format: `omni` (ZIP_STORED, unchanged resource bytes)

            ### Installation

            Install `OrbisFox-Homebrew.pkg` manually with your existing
            homebrew package installer on a console you own. This workflow
            only builds and packages; it does not install, launch, enable
            diagnostics, or contact a console.

            ### Scope of validation

            Host tests, native link, and package extraction verification
            passed in CI. This is **not** on-console acceptance. Long stalls,
            `CE-34878-0` crashes, incomplete streaming, and WebSocket failures
            remain documented; no JIT, WebAssembly, GPU rendering, hardware
            decoding, DRM, or uBO is included.

            See `README.md`, `HARDWARE.md`, `HOMEBREW_SDK.md`, and
            `RELEASE_NOTES.md` for known limits and evidence levels.

            ### Build information

            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            - SDK: homebrew
            - Portable Baseline: enabled (`--portable-baseline`)